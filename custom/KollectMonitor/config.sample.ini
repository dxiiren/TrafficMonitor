; Keys to set in %APPDATA%\TrafficMonitor\config.ini (install.ps1 applies them while TrafficMonitor is stopped)
[general]
hardware_monitor_item = 3
[config]
show_task_bar_wnd = true
hide_main_window = 0
show_cpu_memory = true
skin_selected = \KollectMonitor
always_on_top = false
lock_window_pos = true
[task_bar]
item_space = 16
tbar_display_item = 0
plugin_display_item = LegionTemp.cpu,LegionTemp.cpu_usage,LegionTemp.gpu_usage,LegionTemp.mem
